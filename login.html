<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKRA | Operator Sign In</title>
    <link rel="icon" type="image/png" href="akra.png">
    
    <!-- Clean Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-app: #0a0e17;
            --bg-card: #131924;
            --primary: #00d2ff;
            --primary-gradient: linear-gradient(135deg, #00d2ff, #0077b6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --danger: #ef4444;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background: var(--bg-app); 
            color: var(--text-primary); 
            font-family: var(--font-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100dvh; 
            padding: 16px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            background: var(--bg-card);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo-wrap {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px auto;
            border-radius: 12px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrap img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        h2 { 
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .input-group { 
            margin-bottom: 16px; 
            text-align: left; 
        }

        label { 
            font-size: 0.78rem; 
            display: block; 
            margin-bottom: 6px; 
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #090d15;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { 
            border-color: var(--primary); 
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-gradient);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover { 
            opacity: 0.95;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
        }

        .toggle-link:hover { 
            color: var(--primary); 
            text-decoration: underline; 
        }

        #status-msg { 
            margin-top: 14px; 
            font-size: 0.82rem; 
            min-height: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-wrap">
        <img src="akra.png" alt="AKRA">
    </div>
    <h2 id="form-title">Operator Sign In</h2>
    <div class="subtitle" id="form-subtitle">Enter your operator credentials to access AKRA</div>
    <div id="status-msg"></div>

    <form onsubmit="handleFormSubmit(event)">
        <div class="input-group">
            <label for="username">Operator Username</label>
            <input type="text" id="username" placeholder="Username..." autocomplete="username" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password..." autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn" id="main-btn">Sign In</button>
    </form>
    
    <div class="toggle-link" id="toggle-link" onclick="toggleMode()">New Operator? Create an account.</div>
</div>

<script>
    let isLoginMode = true;

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('form-title').innerText = isLoginMode ? "Operator Sign In" : "Create Operator Account";
        document.getElementById('form-subtitle').innerText = isLoginMode ? "Enter your operator credentials to access AKRA" : "Register a new operator profile";
        document.getElementById('main-btn').innerText = isLoginMode ? "Sign In" : "Create Account";
        document.getElementById('toggle-link').innerText = isLoginMode ? "New Operator? Create an account." : "Already registered? Sign In.";
        document.getElementById('status-msg').innerText = "";
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        authenticate();
    }

    async function authenticate() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const status = document.getElementById('status-msg');

        if (!user || !pass) {
            status.style.color = "var(--danger)";
            status.innerText = "Please fill in all fields.";
            return;
        }

        const route = isLoginMode ? '/login' : '/signup';
        status.style.color = "var(--primary)";
        status.innerText = isLoginMode ? "Signing in..." : "Creating account...";

        try {
            const response = await fetch(route, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            const data = await response.json();

            if (response.ok) {
                if (isLoginMode) {
                    status.style.color = "#10b981";
                    status.innerText = "Access granted! Loading...";
                    setTimeout(() => window.location.href = "/", 600);
                } else {
                    alert("Account created successfully! Please sign in.");
                    toggleMode();
                    document.getElementById('username').value = user;
                    document.getElementById('password').value = "";
                }
            } else {
                status.style.color = "var(--danger)";
                if (data.banned) {
                    status.innerText = "🚫 ACCESS DENIED: Account suspended by Admin.";
                } else {
                    status.innerText = data.message || "Invalid credentials.";
                }
            }
        } catch (err) {
            status.style.color = "var(--danger)";
            status.innerText = "Server connection error.";
        }
    }
</script>

</body>
</html>
