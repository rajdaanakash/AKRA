<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKRA | Authorized Personnel Authentication</title>
    <link rel="icon" type="image/png" href="akra.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --bg-dark: #05080e;
            --card-bg: rgba(10, 16, 26, 0.85);
            --border-color: rgba(0, 210, 255, 0.25);
            --danger: #ff4b4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--primary); 
            font-family: 'Rajdhani', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px var(--primary-glow);
            text-align: center;
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #00d2ff, #004e92);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .logo-badge img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 50%;
        }

        h2 { 
            font-family: 'Orbitron', monospace;
            letter-spacing: 3px; 
            margin-bottom: 8px;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #8fa3b7;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }

        label { 
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem; 
            display: block; 
            margin-bottom: 6px; 
            color: #00d2ff;
            opacity: 0.9; 
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(4, 8, 14, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { 
            border-color: #00d2ff; 
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            background: rgba(6, 12, 22, 0.9);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d2ff, #008fb3);
            color: #050b14;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn:hover { 
            background: #00e5ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }

        .toggle-text {
            margin-top: 22px;
            font-size: 0.85rem;
            cursor: pointer;
            color: #8fa3b7;
            transition: 0.3s;
            font-family: 'Fira Code', monospace;
        }

        .toggle-text:hover { 
            color: #00d2ff; 
            text-decoration: underline; 
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        #status-msg { 
            margin-top: 15px; 
            font-size: 0.85rem; 
            min-height: 22px;
            font-family: 'Fira Code', monospace;
            font-weight: 600;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #52637a;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-badge">
        <img src="akra.png" alt="AKRA">
    </div>
    <h2 id="form-title">SYSTEM LOGIN</h2>
    <div class="subtitle" id="form-subtitle">Authorized Operator Gateway</div>
    <div id="status-msg"></div>

    <form onsubmit="handleFormSubmit(event)">
        <div class="input-group">
            <label for="username">OPERATOR ID</label>
            <input type="text" id="username" placeholder="Enter Operator ID..." autocomplete="username" required>
        </div>

        <div class="input-group">
            <label for="password">ACCESS KEY (PASSWORD)</label>
            <input type="password" id="password" placeholder="Enter Access Key..." autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn" id="main-btn">INITIALIZE LINK</button>
    </form>
    
    <div class="toggle-text" id="toggle-link" onclick="toggleMode()">New Operator? Request Registry.</div>

    <div class="footer-note">AKRA SECURE NEURAL PROTOCOL v2.6</div>
</div>

<script>
    let isLoginMode = true;

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('form-title').innerText = isLoginMode ? "SYSTEM LOGIN" : "REGISTER OPERATOR";
        document.getElementById('form-subtitle').innerText = isLoginMode ? "Authorized Operator Gateway" : "Create Private Sector Credentials";
        document.getElementById('main-btn').innerText = isLoginMode ? "INITIALIZE LINK" : "CREATE OPERATOR ACCOUNT";
        document.getElementById('toggle-link').innerText = isLoginMode ? "New Operator? Request Registry." : "Already have ID? Sign In.";
        document.getElementById('status-msg').innerText = "";
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        authenticate();
    }

    async function authenticate() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const status = document.getElementById('status-msg');

        if (!user || !pass) {
            status.style.color = "var(--danger)";
            status.innerText = "Error: Credentials incomplete.";
            return;
        }

        const route = isLoginMode ? '/login' : '/signup';
        status.style.color = "#00d2ff";
        status.innerText = isLoginMode ? "Authenticating Operator..." : "Provisioning Sector...";

        try {
            const response = await fetch(route, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            const data = await response.json();

            if (response.ok) {
                if (isLoginMode) {
                    status.style.color = "#00ff88";
                    status.innerText = "ACCESS GRANTED. Redirecting to Core Interface...";
                    setTimeout(() => window.location.href = "/", 800);
                } else {
                    alert("Account Created Successfully! Your private sector is initialized. Please log in.");
                    toggleMode();
                    document.getElementById('username').value = user;
                    document.getElementById('password').value = "";
                }
            } else {
                status.style.color = "var(--danger)";
                if (data.banned) {
                    status.innerText = "🚫 ACCESS DENIED: Account suspended/banned by Admin.";
                } else {
                    status.innerText = data.message || "ACCESS DENIED: Invalid credentials.";
                }
            }
        } catch (err) {
            status.style.color = "var(--danger)";
            status.innerText = "SYSTEM ERROR: Neural Link connection failed.";
        }
    }
</script>

</body>
</html>
